<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Platform</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">wangyutang.com</p>
          <h1>多模块实控可视化平台</h1>
          <p class="lead">统一入口负责多个模块系统；每个系统由独立镜像容器执行。</p>
          <div class="love-note" aria-label="爱你哟，小猪">
            <span class="love-text">爱你哟，小猪</span>
            <span class="pig-family" aria-hidden="true">
              <button class="running-pig side-pig worker-pig" type="button" aria-label="切换干活小猪">
                <span class="pig-shadow"></span>
                <span class="pig-ear pig-ear-left"></span>
                <span class="pig-ear pig-ear-right"></span>
                <span class="pig-hair"></span>
                <span class="pig-face">
                  <span class="pig-eye pig-eye-left"></span>
                  <span class="pig-eye pig-eye-right"></span>
                  <span class="pig-nose">
                    <span></span>
                    <span></span>
                  </span>
                  <span class="pig-brow pig-brow-left"></span>
                  <span class="pig-brow pig-brow-right"></span>
                </span>
                <span class="pig-leg pig-leg-left"></span>
                <span class="pig-leg pig-leg-right"></span>
              </button>
              <button class="running-pig mini-pig heart-pig" type="button" aria-label="发出爱心">
                <span class="heart-burst" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                </span>
                <span class="pig-shadow"></span>
                <span class="pig-ear pig-ear-left"></span>
                <span class="pig-ear pig-ear-right"></span>
                <span class="pig-face">
                  <span class="pig-eye pig-eye-left"></span>
                  <span class="pig-eye pig-eye-right"></span>
                  <span class="pig-nose">
                    <span></span>
                    <span></span>
                  </span>
                </span>
                <span class="pig-leg pig-leg-left"></span>
                <span class="pig-leg pig-leg-right"></span>
              </button>
              <button class="running-pig side-pig side-pig-right wink-pig" type="button" aria-label="切换媚眼小猪">
                <span class="pig-shadow"></span>
                <span class="pig-ear pig-ear-left"></span>
                <span class="pig-ear pig-ear-right"></span>
                <span class="pig-bow"></span>
                <span class="pig-face">
                  <span class="pig-eye pig-eye-left"></span>
                  <span class="pig-eye pig-eye-right"></span>
                  <span class="pig-nose">
                    <span></span>
                    <span></span>
                  </span>
                  <span class="pig-glasses"></span>
                  <span class="pig-lash"></span>
                </span>
                <span class="pig-leg pig-leg-left"></span>
                <span class="pig-leg pig-leg-right"></span>
              </button>
            </span>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="status-pill" href="/api/health">Platform health</a>
        </div>
      </header>

      <section class="overview">
        <article>
          <p class="eyebrow">Architecture</p>
          <h2>Gateway + Independent Modules</h2>
          <p>论文、远程遥控、遥感和后续实控系统分别部署、分别扩展、分别保存数据。</p>
        </article>
        <article>
          <p class="eyebrow">Routing</p>
          <h2>Subdomains First</h2>
          <p><code>papers</code>、<code>remote</code>、<code>sensing</code> 各自运行，入口在这里统一汇总。</p>
        </article>
      </section>

      <section class="module-section">
        <div class="section-head">
          <div>
            <p class="eyebrow">Modules</p>
            <h2>系统模块</h2>
          </div>
          <button id="refreshButton" type="button">刷新状态</button>
        </div>
        <div id="moduleGrid" class="module-grid"></div>
      </section>

      <section class="notes">
        <p class="eyebrow">Next</p>
        <p>新增系统时，只需要新增镜像、健康检查、子域名路由和 registry 记录。</p>
      </section>
    </main>
    <script type="module" src="/static/app.js"></script>
    <script>
      document.querySelector('.heart-pig')?.addEventListener('click', (event) => {
        event.currentTarget.classList.remove('pop-hearts');
        void event.currentTarget.offsetWidth;
        event.currentTarget.classList.add('pop-hearts');
      });
      document.querySelector('.worker-pig')?.addEventListener('click', (event) => {
        event.currentTarget.classList.toggle('is-worker');
      });
      document.querySelector('.wink-pig')?.addEventListener('click', (event) => {
        event.currentTarget.classList.toggle('is-wink');
      });
    </script>
  </body>
</html>
