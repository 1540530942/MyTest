services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8}
    container_name: control-platform-caddy
    depends_on:
      platform:
        condition: service_healthy
      paper-learning:
        condition: service_healthy
      camera-snapshot:
        condition: service_healthy
    env_file:
      - .env.platform
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  platform:
    image: ${CONTROL_PLATFORM_IMAGE:-control-platform:local}
    container_name: control-platform
    env_file:
      - .env.platform
    volumes:
      - ../registry.json:/app/modules/registry.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  paper-hermes:
    image: ${PAPER_HERMES_IMAGE:-paper-hermes:local}
    container_name: paper-hermes
    env_file:
      - .env.platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  paper-learning:
    image: ${PAPER_LEARNING_IMAGE:-paper-learning-system:local}
    container_name: paper-learning-system
    env_file:
      - .env.platform
    depends_on:
      paper-hermes:
        condition: service_healthy
    volumes:
      - paper_learning_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  camera-snapshot:
    image: ${CAMERA_SNAPSHOT_IMAGE:-camera-snapshot:local}
    container_name: camera-snapshot
    env_file:
      - .env.platform
    volumes:
      - camera_snapshot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  paper_learning_data:
  camera_snapshot_data:
  caddy_data:
  caddy_config:
