<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arduino Remote LED</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        background: #111827;
        color: #f9fafb;
      }
      .card {
        background: #1f2937;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-top: 0;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 20px 0;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
      }
      .on { background: #22c55e; color: #052e16; }
      .off { background: #ef4444; color: white; }
      .status { background: #60a5fa; color: #0f172a; }
      pre {
        background: #0f172a;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .meta {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Arduino Remote LED Controller</h1>
      <p class="meta">Minimal local control panel for pin 13 LED via FastAPI + Serial.</p>

      <div class="actions">
        <button class="on" onclick="sendCommand('/led/on', 'POST')">LED ON</button>
        <button class="off" onclick="sendCommand('/led/off', 'POST')">LED OFF</button>
        <button class="status" onclick="sendCommand('/status', 'GET')">GET STATUS</button>
      </div>

      <h2>Response</h2>
      <pre id="output">Waiting for action...</pre>
    </div>

    <script>
      async function sendCommand(path, method) {
        const output = document.getElementById('output');
        output.textContent = 'Loading...';

        try {
          const response = await fetch(path, { method });
          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = `Request failed: ${error}`;
        }
      }

      sendCommand('/status', 'GET');
    </script>
  </body>
</html>
