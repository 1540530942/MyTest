services:
  paper-hermes:
    image: ${PAPER_HERMES_IMAGE:-paper-hermes:local}
    container_name: paper-hermes
    env_file:
      - .env.cloud
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  paper-learning:
    image: ${PAPER_LEARNING_IMAGE:-paper-learning-system:local}
    container_name: paper-learning-system
    env_file:
      - .env.cloud
    depends_on:
      paper-hermes:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - paper_learning_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  paper_learning_data:
