services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8}
    container_name: paper-learning-caddy
    depends_on:
      paper-learning:
        condition: service_healthy
    env_file:
      - .env.cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  paper-hermes:
    image: ${PAPER_HERMES_IMAGE:-paper-hermes:local}
    build:
      context: ..
      dockerfile: Dockerfile.hermes
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: paper-hermes
    env_file:
      - .env.cloud
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  paper-learning:
    image: ${PAPER_LEARNING_IMAGE:-paper-learning-system:local}
    build:
      context: ..
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: paper-learning-system
    env_file:
      - .env.cloud
    depends_on:
      paper-hermes:
        condition: service_healthy
    volumes:
      - paper_learning_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  paper_learning_data:
  caddy_data:
  caddy_config:
