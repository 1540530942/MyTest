<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大模型接口管理</title>
    <link rel="stylesheet" href="./static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">LLM Manager</p>
          <h1>大模型接口管理</h1>
        </div>
        <div class="status" id="health">连接中</div>
      </section>

      <section class="layout">
        <aside class="panel providers-panel">
          <div class="panel-head">
            <h2>接口配置</h2>
            <button class="icon-button" id="refreshProviders" title="刷新">↻</button>
          </div>
          <form id="providerForm" class="provider-form">
            <label>
              标识
              <input name="id" placeholder="openai" />
            </label>
            <label>
              名称
              <input name="name" placeholder="OpenAI" required />
            </label>
            <label>
              Base URL
              <input name="base_url" placeholder="https://api.openai.com/v1" required />
            </label>
            <label>
              API Key
              <input name="api_key" type="password" autocomplete="off" placeholder="可留空，使用环境变量" />
            </label>
            <label>
              Key 环境变量
              <input name="api_key_env" placeholder="OPENAI_API_KEY" />
            </label>
            <label>
              默认模型
              <input name="default_model" placeholder="gpt-4.1-mini" required />
            </label>
            <label>
              Chat Path
              <input name="chat_path" value="/chat/completions" required />
            </label>
            <label class="inline-check">
              <input name="enabled" type="checkbox" checked />
              启用
            </label>
            <button type="submit">保存接口</button>
          </form>
          <div class="provider-list" id="providerList"></div>
        </aside>

        <section class="panel chat-panel">
          <div class="panel-head">
            <h2>模型对话</h2>
            <div class="chat-settings">
              <select id="providerSelect"></select>
              <input id="modelInput" placeholder="模型名" />
            </div>
          </div>
          <div class="messages" id="messages"></div>
          <form id="chatForm" class="chat-form">
            <textarea id="promptInput" rows="4" placeholder="输入要发送给大模型的内容"></textarea>
            <button type="submit">发送</button>
          </form>
        </section>
      </section>
    </main>
    <script src="./static/app.js"></script>
  </body>
</html>
