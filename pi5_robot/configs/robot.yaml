robot:
  name: pi5-harness-robot
  mode: simulation
  drive_type: differential
  wheel_diameter_cm: 6.5
  wheel_base_cm: 14.0
  max_speed_mps: 0.3
  max_angular_speed_dps: 60

serial:
  port: /dev/ttyACM0
  baudrate: 115200

camera:
  type: simulated
  resolution: [1280, 720]
  fps: 15

servo:
  pan_range: [-90, 90]
  tilt_range: [-35, 45]
