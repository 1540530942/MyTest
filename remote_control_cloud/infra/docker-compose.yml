services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: remote-server-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    restart: unless-stopped

volumes:
  mqtt_data:
  mqtt_log:
